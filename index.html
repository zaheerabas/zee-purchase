<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5e2750">
<meta name="description" content="Purchase book for Zee Collection: bills, supplier khata and reports.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zee Purchase">
<title>Zee Collection · Purchase Book</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Marcellus&display=swap" rel="stylesheet">
<script>try{var t=JSON.parse(localStorage.getItem("zee-theme")||'"auto"');if(t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
/* splash: inline so it paints before app.css arrives */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#f6f2f5;color:#241a24;font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #splash{background:#140f16;color:#f2eaf0}}
:root[data-theme="dark"] #splash{background:#140f16;color:#f2eaf0}
.sp-in{display:grid;justify-items:center;text-align:center}
.sp-mark{width:96px;height:96px;filter:drop-shadow(0 10px 26px rgba(94,39,80,.32));animation:spMark .6s cubic-bezier(.16,1,.3,1) both}
.sp-draw{stroke-dasharray:100;stroke-dashoffset:100;animation:spDraw .9s .15s cubic-bezier(.65,0,.35,1) forwards}
.sp-z{font-family:Marcellus,Georgia,"Times New Roman",serif;font-size:50px;fill:#f8ecf4;animation:spFade .5s .25s both}
.sp-name{font-family:Marcellus,Georgia,serif;font-size:28px;margin-top:18px;letter-spacing:.01em;animation:spUp .5s .3s cubic-bezier(.16,1,.3,1) both}
.sp-sub{font-size:14px;opacity:.65;margin-top:2px;animation:spUp .5s .4s cubic-bezier(.16,1,.3,1) both}
.sp-bar{width:120px;height:3px;border-radius:2px;background:rgba(201,162,79,.25);margin-top:22px;overflow:hidden;animation:spFade .3s .5s both}
.sp-bar i{display:block;height:100%;width:40%;border-radius:2px;background:#c9a24f;animation:spLoad 1s .5s cubic-bezier(.65,0,.35,1) infinite}
@keyframes spMark{from{transform:scale(.86);opacity:0}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFade{from{opacity:0}}
@keyframes spUp{from{opacity:0;transform:translateY(8px)}}
@keyframes spLoad{from{transform:translateX(-110%)}to{transform:translateX(280%)}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01ms!important;animation-delay:0s!important}.sp-draw{stroke-dashoffset:0}.sp-bar i{animation:none;width:100%}}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-in">
  <svg class="sp-mark" viewBox="0 0 96 96"><defs><mask id="spm"><rect class="sp-draw" x="10" y="10" width="76" height="76" rx="17" fill="none" stroke="#fff" stroke-width="5" pathLength="100"/></mask></defs>
    <rect width="96" height="96" rx="24" fill="#5e2750"/>
    <rect x="10" y="10" width="76" height="76" rx="17" fill="none" stroke="#c9a24f" stroke-width="1.6" stroke-dasharray="4 3" mask="url(#spm)"/>
    <text class="sp-z" x="48" y="65" text-anchor="middle">Z</text></svg>
  <div class="sp-name">Zee Collection</div><div class="sp-sub">Purchase book</div><div class="sp-bar"><i></i></div>
</div></div>
<div id="ptr" aria-hidden="true"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></div>
<div class="shell">
  <aside class="side"><div class="side-in">
    <a class="brand" href="#home"><span class="mark">Z</span><span class="brand-t"><b>Zee Collection</b><span>Purchase book · Sialkot</span></span></a>
    <nav class="nav needcfg" aria-label="Main">
      <a href="#home" data-tab="home"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
      <a href="#bills" data-tab="bills"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Bills</a>
      <a href="#suppliers" data-tab="suppliers"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 5 4h14l2 5"/><path d="M4 9v11h16V9"/><path d="M3 9h18M9 20v-6h6v6"/></svg>Suppliers</a>
      <a href="#reports" data-tab="reports"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg>Reports</a>
      <a href="#settings" data-tab="settings" class="set"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
    </nav>
    <div class="actions">
      <button class="syncpill hidden" id="syncPill" data-act="sync" title="Sync now"></button>
      <button class="btn pri newbtn needcfg" data-act="new-bill"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New bill</button>
      <a class="iconbtn setbtn needcfg" href="#settings" aria-label="Settings" title="Settings"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></a>
    </div>
    <div class="side-foot"><button class="iconbtn" data-act="theme" aria-label="Change theme"><span class="th-ic"></span></button><span class="th-lbl"></span></div>
  </div></aside>
  <main id="app"><p class="muted">Loading…</p></main>
</div>

<nav class="bnav needcfg" aria-label="Main">
  <a href="#home" data-tab="home"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#bills" data-tab="bills"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Bills</a>
  <button class="fab" data-act="new-bill" aria-label="New bill"><span class="dot"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>New bill</button>
  <a href="#suppliers" data-tab="suppliers"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 5 4h14l2 5"/><path d="M4 9v11h16V9"/><path d="M3 9h18"/></svg>Suppliers</a>
  <a href="#reports" data-tab="reports"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg>Reports</a>
</nav>
<button class="voicefab needcfg" data-act="voice" aria-label="Speak a bill or command" title="Speak"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>

<div id="sheetRoot"></div>
<div id="voiceRoot"></div>
<div id="dlgRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<noscript>This app needs JavaScript turned on.</noscript>
<script src="app.js"></script>
</body>
</html>
